<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Information — المجلد</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/folder.css">

</head>

<body>

<main class="folder-page">

    <header class="folder-topbar">

        <button id="backButton" class="secondary-button">

            <svg viewBox="0 0 24 24">
                <path d="m15 18-6-6 6-6"></path>
            </svg>

            <span>رجوع</span>

        </button>


        <div class="folder-title">

            <div class="folder-title-icon">

                <svg viewBox="0 0 24 24">
                    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
                </svg>

            </div>

            <div>
                <h1 id="folderTitle">...</h1>
                <p id="folderSubtitle"></p>
            </div>

        </div>


        <button id="newSubfolder" class="primary-button">

            <svg viewBox="0 0 24 24">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
                <path d="M12 10v6"></path>
                <path d="M9 13h6"></path>
            </svg>

            <span>مجلد فرعي</span>

        </button>

    </header>


    <section class="folder-actions">

        <button id="newNote" class="action-card">

            <span class="action-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 4h14v16H5z"></path>
                    <path d="M8 8h8"></path>
                    <path d="M8 12h8"></path>
                    <path d="M8 16h5"></path>
                </svg>
            </span>

            <strong>ملاحظة جديدة</strong>
            <small>أضف معلومات ونصوص</small>

        </button>


        <button id="uploadImages" class="action-card">

            <span class="action-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                    <circle cx="8" cy="9" r="1.5"></circle>
                    <path d="m21 16-5-5-6 6-2-2-5 5"></path>
                </svg>
            </span>

            <strong>رفع صور</strong>
            <small>يمكنك اختيار عدة صور</small>

        </button>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
            multiple
            hidden
        >

    </section>


    <section class="folder-section">

        <div class="section-title">
            <h2>المجلدات الفرعية</h2>
        </div>

        <div id="subfolders" class="subfolders"></div>

    </section>


    <section class="folder-section">

        <div class="section-title">
            <h2>الملاحظات</h2>
        </div>

        <div id="notesList" class="notes-list"></div>

    </section>


    <section class="folder-section">

        <div class="section-title">
            <h2>الصور</h2>
        </div>

        <div id="imagesGrid" class="images-grid"></div>

    </section>

</main>


<div id="noteModal" class="modal hidden">

    <div class="modal-card">

        <div class="modal-header">

            <div>
                <h2 id="noteModalTitle">ملاحظة جديدة</h2>
            </div>

            <button id="closeNoteModal" class="modal-close">
                ×
            </button>

        </div>

        <form id="noteForm">

            <input id="noteId" type="hidden">

            <input
                id="noteTitle"
                type="text"
                placeholder="عنوان الملاحظة"
                maxlength="150"
                required
            >

            <textarea
                id="noteContent"
                placeholder="اكتب المعلومات هنا..."
                rows="9"
            ></textarea>


            <div class="location-row">

                <button
                    type="button"
                    id="getLocation"
                    class="secondary-button"
                >
                    📍 حفظ موقعي
                </button>

                <span id="locationStatus"></span>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelNote"
                    class="secondary-button"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    حفظ
                </button>

            </div>

        </form>

    </div>

</div>


<div id="subfolderModal" class="modal hidden">

    <div class="modal-card">

        <div class="modal-header">

            <h2>مجلد فرعي جديد</h2>

            <button id="closeSubfolderModal" class="modal-close">
                ×
            </button>

        </div>

        <form id="subfolderForm">

            <input
                id="subfolderName"
                type="text"
                placeholder="اسم المجلد"
                maxlength="80"
                required
            >

            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelSubfolder"
                    class="secondary-button"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    إنشاء
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/location.js"></script>
<script src="js/folders.js"></script>
<script src="js/notes.js"></script>
<script src="js/images.js"></script>

</body>
</html>
